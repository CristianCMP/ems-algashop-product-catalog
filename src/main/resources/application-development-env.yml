spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/product-catalog/aws-s3?prefix=catalog.secrets.
      - aws-secretsmanager:/secret/algashop/product-catalog/redis-password?prefix=catalog.secrets.
      - aws-parameterstore:/config/algashop/product-catalog?prefix=catalog.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566 # Don't need in production, is only for develop
      credentials:
        access-key: ${catalog.secrets.access-key}
        secret-key: ${catalog.secrets.secret-key}
      s3:
        enabled: true
        path-style-access-enabled: true  # Don't need in production, is only for develop
  cache:
    type: redis
  mongodb:
    uri: ${catalog.params.mongodb.uri}
#    uri: mongodb://localhost:27017,localhost:27018,localhost:27019/product_catalog?replicaSet=rs0
#    uri: mongodb://root:algashop@localhost:27017/product_catalog?authSource=admin
#    representation.uuid: standard
  data:
    redis:
      host: ${catalog.params.redis.host}
      port: ${catalog.params.redis.port}
      password: ${catalog.secrets.redis-password}
      database: ${catalog.params.redis.database}
      timeout: ${catalog.params.redis.timeout}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${shared.params.auth-server-url}
#          issuer-uri: http://auth.algashop.local:8081
#          jwk-set-uri: http://127.0.0.1:8081/oauth2/jwks
  kafka:
    bootstrap-servers: algashop-kafka-1:9092,algashop-kafka-2:9093,algashop-kafka-3:9094
    # Initial connection point
    admin:
      fail-fast: true # Fail fast if unable to connect to the cluster
      auto-create: true # Allows for the automatic creation of topics if they do not exist.
      modify-topic-configs: false # Prevents modification of existing topic settings.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.type.mapping:
          ProductCatalog.ProductDelistedIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductDelistedIntegrationEvent,
          ProductCatalog.ProductListedIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductListedIntegrationEvent,
          ProductCatalog.ProductAddedIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductAddedIntegrationEvent

logging:
  level:
#    org.mongodb.driver.protocol.command: DEBUG
##    org.mongodb.driver.protocol.query: DEBUG
##    org.mongodb.driver.connection: DEBUG
#    org.mongodb.driver.cluster: OFF
    com.netflix.discovery.DiscoveryClient: OFF
    com.netflix.discovery: OFF
    com.netflix.eureka: OFF

algashop:
  data-load:
    enabled: true
    auto-delete: true
  mapping:
#    image-storage-url: http://localhost:4566/algashop-product-image
#    image-storage-url: http://algashop-localstack:4566/algashop-product-image
    image-storage-url: ${catalog.params.storage.image-storage-url}
  storage:
    s3:
      bucket-name: ${catalog.params.storage.bucket-name}

eureka:
  client:
    serviceUrl:
      defaultZone: ${shared.params.service-registry-url}/eureka
    healthcheck:
      enabled: true
  instance:
    instance-id: ${random.uuid}
    prefer-ip-address: true